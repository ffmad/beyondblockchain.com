<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="107 45 1040 1040" fill="none" role="img" aria-labelledby="title description">
  <title id="title">FestCompass</title>
  <desc id="description">The approved B3 festival stage: a layered navy canopy, green lights and speakers, and a folded coral compass needle.</desc>
  <!-- B3 master: editable paths, gradients and shallow contact shadows. No raster images. -->
  <defs>
    <linearGradient id="canopy-fill" x1="405" y1="243" x2="773" y2="659" gradientUnits="userSpaceOnUse">
      <stop stop-color="#213b62"/><stop offset=".42" stop-color="#1e375c"/><stop offset=".72" stop-color="#1b3255"/><stop offset="1" stop-color="#1f395f"/>
    </linearGradient>
    <linearGradient id="panel" x1="440" y1="541" x2="645" y2="1018" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14283e"/><stop offset=".25" stop-color="#182d49"/><stop offset="1" stop-color="#1a304e"/>
    </linearGradient>
    <linearGradient id="rigging" x1="199" y1="550" x2="1055" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a314f"/><stop offset=".5" stop-color="#172b44"/><stop offset="1" stop-color="#172b44"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#1a314f"/><stop offset=".35" stop-color="#172c47"/><stop offset="1" stop-color="#192f4b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#0cc9a3"/><stop offset=".5" stop-color="#08c398"/><stop offset="1" stop-color="#00b995"/>
    </linearGradient>
    <linearGradient id="flag" x1="625" y1="119" x2="731" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32ae90"/><stop offset="1" stop-color="#2ba487"/>
    </linearGradient>
    <linearGradient id="driver" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#fafaf7"/>
    </linearGradient>
    <linearGradient id="coral-face" x1="585" y1="710" x2="751" y2="611" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6553"/><stop offset="1" stop-color="#ff634f"/>
    </linearGradient>
    <linearGradient id="coral-fold" x1="741" y1="654" x2="663" y2="787" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f15443"/><stop offset="1" stop-color="#ed503f"/>
    </linearGradient>
    <linearGradient id="needle-face" x1="568" y1="749" x2="506" y2="903" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203c64"/><stop offset="1" stop-color="#1b3459"/>
    </linearGradient>
    <linearGradient id="needle-fold" x1="608" y1="806" x2="475" y2="929" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142b46"/><stop offset="1" stop-color="#102238"/>
    </linearGradient>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dy="3" result="offset"/><feFlood flood-color="#102035" flood-opacity=".12"/><feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="detail-shadow" x="-35%" y="-25%" width="170%" height="165%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="1" dy="8" result="offset"/><feFlood flood-color="#030e1c" flood-opacity=".28"/><feComposite in2="offset" operator="in" result="ambient"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="contact-blur"/><feOffset in="contact-blur" dy="4" result="contact-offset"/><feFlood flood-color="#030e1c" flood-opacity=".65"/><feComposite in2="contact-offset" operator="in" result="contact"/>
      <feMerge><feMergeNode in="ambient"/><feMergeNode in="contact"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="canopy-shadow" x="-5%" y="-5%" width="110%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/><feOffset in="blur" dy="5" result="offset"/><feFlood flood-color="#0a1728" flood-opacity=".24"/><feComposite in2="offset" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="pivot" maskUnits="userSpaceOnUse" x="450" y="580" width="340" height="370">
      <path d="M450 580h340v370H450z" fill="white"/><circle cx="620.5" cy="767" r="39.5" fill="black"/>
    </mask>
  </defs>
  <g id="festcompass-mark">
    <g id="rigging-and-pole" fill="url(#rigging)">
      <path d="M623 166h15v63h-15z"/>
      <path d="M199 540h28v236h-28zM1026 540h28v236h-28z"/>
      <path d="m218 658 85-81v34l-76 76-9-29ZM1026 658l-76-80v35l76 74v-29Z"/>
    </g>
    <path id="stage-left" d="M303 480h324v5C477 485 361 616 363 774c0 98 35 177 96 232 6 6 3 12-5 12H314c-7 0-11-5-11-12V480Z" fill="url(#panel)" filter="url(#paper-shadow)"/>
    <path id="stage-right" d="M950 480H627v5c147 0 263 131 261 289 0 98-36 177-95 232-6 6-3 12 5 12h141c7 0 11-5 11-12V480Z" fill="url(#panel)" filter="url(#paper-shadow)"/>
    <path id="canopy" d="M619 212q9-7 18 0C794 325 943 410 1098 488q13 7 13 20v33q0 16-16 16C941 548 828 529 733 502c-36-11-66-17-106-17s-70 6-106 17C426 529 313 548 159 557q-16 0-16-16v-33q0-13 13-20C313 410 462 325 619 212Z" fill="url(#canopy-fill)" stroke="#254267" stroke-width="1" filter="url(#canopy-shadow)"/>
    <path id="pennant" d="M623.5 120c0-6 4-9 10-7 33 12 65 19 99 28 11 3 11 11 0 15-37 17-69 23-109 23v-59Z" fill="url(#flag)" filter="url(#paper-shadow)"/>
    <g id="stage-lights" fill="url(#teal)" stroke="#46d9b3" stroke-opacity=".35" stroke-width="1" filter="url(#detail-shadow)">
      <rect x="614" y="342" width="28" height="108" rx="14"/>
      <rect x="466.5" y="380" width="28" height="99" rx="14" transform="rotate(-25 480.5 429.5)"/>
      <rect x="758.5" y="380" width="28" height="99" rx="14" transform="rotate(25 772.5 429.5)"/>
    </g>
    <g id="speaker-left">
      <rect x="153" y="769" width="144" height="249" rx="16" fill="url(#cabinet)" stroke="#31506c" stroke-width="1" filter="url(#paper-shadow)"/>
      <circle cx="224.5" cy="830.5" r="22.5" fill="url(#driver)" filter="url(#detail-shadow)"/>
      <path d="M278 935.5a53.5 53.5 0 1 1-107 0 53.5 53.5 0 0 1 107 0Zm-28.5 0a25 25 0 1 0-50 0 25 25 0 0 0 50 0Z" fill="url(#teal)" fill-rule="evenodd" stroke="#2ed2aa" stroke-opacity=".4" stroke-width="1" filter="url(#detail-shadow)"/>
    </g>
    <g id="speaker-right">
      <rect x="956" y="769" width="145" height="249" rx="16" fill="url(#cabinet)" stroke="#31506c" stroke-width="1" filter="url(#paper-shadow)"/>
      <circle cx="1028.5" cy="830.5" r="22.5" fill="url(#driver)" filter="url(#detail-shadow)"/>
      <path d="M1082 935.5a53.5 53.5 0 1 1-107 0 53.5 53.5 0 0 1 107 0Zm-28.5 0a25 25 0 1 0-50 0 25 25 0 0 0 50 0Z" fill="url(#teal)" fill-rule="evenodd" stroke="#2ed2aa" stroke-opacity=".4" stroke-width="1" filter="url(#detail-shadow)"/>
    </g>
    <g id="compass-needle" mask="url(#pivot)">
      <path d="m565.5 733.5 99.5 81.5-193 117q-7 4-5-4 46-99 97-192 1-3 1.5-2.5Z" fill="url(#needle-face)"/>
      <path d="m615 781 50 34-193 117q-5 3-6-1l149-150Z" fill="url(#needle-fold)"/>
      <path d="m580 717 180-118q8-4 5 5l-90 196q-1 4-4 1l-91-81q-2-1 0-3Z" fill="url(#coral-face)"/>
      <path d="m765 600-90 200q-1 4-4 1l-49-44L765 600Z" fill="url(#coral-fold)"/>
    </g>
  </g>
</svg>
